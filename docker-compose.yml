version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # Hardening: Cách ly mạng backend
  monitor-net:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:

services:
  # 1. Web Application (Node.js/Express - Quản lý Hợp đồng)
  app:
    build: ./app
    container_name: contract_app
    restart: always
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_USER=contract_user
      - DB_PASSWORD=StrongPass123!
      - DB_NAME=contract_db
      - DB_PORT=5432
    networks:
      - frontend-net
      - backend-net
    user: "1000:1000" # Hardening: Non-root user

  # 2. Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: contract_postgres
    restart: always
    environment:
      POSTGRES_USER: contract_user
      POSTGRES_PASSWORD: StrongPass123!
      POSTGRES_DB: contract_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net

  # 3. Quản trị Database pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: contract_pgadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: StrongAdminPass123!
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - frontend-net
      - backend-net

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: contract_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net

  # 5. Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: contract_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitor-net
      - frontend-net

  # 6. Grafana (Dashboard Giám sát)
  grafana:
    image: grafana/grafana:latest
    container_name: contract_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitor-net

  # 7. Loki (Centralized Logging)
  loki:
    image: grafana/loki:2.9.0
    container_name: contract_loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitor-net

  # 8. Promtail (Thu thập Log)
  promtail:
    image: grafana/promtail:2.9.0
    container_name: contract_promtail
    restart: always
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    networks:
      - monitor-net

  # 9. cAdvisor (Container Monitoring)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: contract_cadvisor
    restart: always 
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - backend-net    
